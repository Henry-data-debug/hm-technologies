<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 60" fill="none" style="display: block;">
  <defs>
    <!-- Gunmetal gradient for H on dark bg -->
    <linearGradient id="gunmetalDarkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>

    <!-- Copper / Rose-Gold gradient for M -->
    <linearGradient id="copperGradDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="40%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- Metallic shine -->
    <linearGradient id="roseGoldDark" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c2785c" />
      <stop offset="50%" stop-color="#e8a588" />
      <stop offset="100%" stop-color="#9e563b" />
    </linearGradient>
  </defs>

  <!-- EMBLEM -->
  <g id="emblem">
    <!-- H left pillar -->
    <path d="M 6 12 L 14 12 L 14 46 L 6 46 Z" fill="url(#gunmetalDarkGrad)" />
    <!-- H crossbar -->
    <path d="M 14 26 L 24 26 L 24 33 L 14 33 Z" fill="url(#gunmetalDarkGrad)" />
    <!-- H right pillar (interlocking) -->
    <path d="M 22 18 L 29 18 L 29 46 L 22 46 Z" fill="url(#gunmetalDarkGrad)" />

    <!-- M Left Wing & Ascending Arrow -->
    <path d="M 18 46 L 24 34 L 30 20 L 33 6 L 36 20 L 42 34 L 48 46 L 43 46 L 38 34 L 33 16 L 28 34 L 23 46 Z" fill="url(#roseGoldDark)" />
    
    <!-- Arrow Head Peak -->
    <polygon points="33,3 27,14 39,14" fill="url(#copperGradDark)" />
    
    <!-- M Right Pillar -->
    <path d="M 44 20 L 51 12 L 57 12 L 57 46 L 50 46 L 50 24 Z" fill="url(#roseGoldDark)" />

    <!-- Tech Circuit Nodes (Blue Gems) -->
    <circle cx="27" cy="27" r="2.2" fill="#0066ff" stroke="#ffffff" stroke-width="0.8" />
    <circle cx="33" cy="18" r="2.2" fill="#0066ff" stroke="#ffffff" stroke-width="0.8" />
    <circle cx="33" cy="9"  r="2.2" fill="#38bdf8" stroke="#ffffff" stroke-width="0.8" />
    <circle cx="39" cy="27" r="2.2" fill="#0066ff" stroke="#ffffff" stroke-width="0.8" />
    <line x1="27" y1="27" x2="33" y2="18" stroke="#ffffff" stroke-width="0.8" opacity="0.9" />
    <line x1="33" y1="18" x2="33" y2="9"  stroke="#ffffff" stroke-width="0.8" opacity="0.9" />
    <line x1="33" y1="18" x2="39" y2="27" stroke="#ffffff" stroke-width="0.8" opacity="0.9" />
  </g>

  <!-- TEXT: HM TECHNOLOGIES -->
  <g id="typography" transform="translate(68, 0)">
    <!-- HM -->
    <text x="0" y="27" font-family="'League Spartan', 'Roboto', sans-serif" font-size="26" font-weight="800" fill="#ffffff" letter-spacing="1">HM</text>
    
    <!-- TECHNOLOGIES -->
    <text x="0" y="40" font-family="'League Spartan', 'Roboto', sans-serif" font-size="11.5" font-weight="700" fill="#cbd5e1" letter-spacing="3.2">TECHNOLOGIES</text>
    
    <!-- SUBTITLE -->
    <text x="0" y="52" font-family="'Roboto', sans-serif" font-size="6.8" font-weight="600" fill="#94a3b8" letter-spacing="1.2">DIGITAL SYSTEMS | ENGINEERING | DATA SOLUTIONS</text>
  </g>
</svg>
